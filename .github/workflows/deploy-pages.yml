name: Build & Deploy Next.js Static (pnpm)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      bust_data_cache:
        description: "Force a fresh dataset refresh (skips cache)"
        required: false
        default: "false"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://kosovatools.org

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Compute Turbo cache key
        id: turbo-key
        run: |
          BASE="turbo-data-$(date -u +%G-W%V)"
          REVISION="$BASE-$GITHUB_SHA-"
          {
            echo "key=$REVISION$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "revision=$REVISION"
            echo "restore=$BASE-"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Turbo cache
        id: turbo-cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.bust_data_cache == 'true') }}
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: ${{ steps.turbo-key.outputs.key }}
          restore-keys: |
            ${{ steps.turbo-key.outputs.restore }}

      - name: Install dependencies
        run: pnpm install

      - name: Build Turborepo packages
        run: pnpm turbo run build --filter=web...
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Save Turbo cache
        if: ${{ !startsWith(steps.turbo-cache.outputs.cache-matched-key, steps.turbo-key.outputs.revision) }}
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ steps.turbo-key.outputs.key }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
